# Static web version (no Rust) on GitHub Pages: same codebase, the platform
# layer picks the File System Access API at runtime.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build
        run: |
          # https://<user>.github.io/<repo>/, or the root for a <user>.github.io repo
          REPO="${{ github.event.repository.name }}"
          case "$REPO" in *.github.io) export BASE_PATH="" ;; *) export BASE_PATH="/$REPO" ;; esac
          bun run build:web
      # The example library (built at /dev/starter, attached to the `starter`
      # release) is served next to the app: the desktop app downloads it from here.
      - name: Example library
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download starter --repo "${{ github.repository }}" --pattern starter.zip --dir "$RUNNER_TEMP"; then
            unzip -q "$RUNNER_TEMP/starter.zip" -d build/starter
          else
            echo "No starter release yet: the example library is skipped."
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
