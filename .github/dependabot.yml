version: 2
updates:
  # Workflows pin actions to commit SHAs (the comment gives the tag): Dependabot
  # bumps both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    ignore:
      # TypeScript 7: not supported by svelte-check and the Svelte tooling yet.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      svelte:
        patterns: ['svelte', 'svelte-check', '@sveltejs/*']
      tauri:
        patterns: ['@tauri-apps/*']
      # The pdf.js assets copied into static/ must match svelte-pdf-mini's pdf.js.
      pdf:
        patterns: ['svelte-pdf-mini', 'pdfjs-dist']
      dev:
        dependency-type: development
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      tauri:
        patterns: ['tauri', 'tauri-*']
      rust:
        patterns: ['*']
